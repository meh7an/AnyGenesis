[package]
name = "anygenesis-ir"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["interpreter"]
# The IR interpreter, `interp`: a test oracle and the runtime's fallback outside games.
interpreter = []

[dependencies]
anygenesis-m68k = { version = "0.1.0", path = "../m68k" }
anygenesis-shared = { version = "0.1.0", path = "../shared" }
thiserror = "2.0.21"

[dev-dependencies]
anygenesis-oracle = { path = "../oracle" }

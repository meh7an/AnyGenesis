# Sonic the Hedgehog (REV00): the frame diff's masks against the reference emulator. The
# v0.1 masks were signed off by Mehran on 2026-10-26 (M3.6 gate, option A); M1.3 removed the
# vertical interrupt counter and sound driver masks (exact timing pairs every stop) and
# narrowed the stacked-PC mask to the bytes that differ. Work RAM by 68000 address, end
# exclusive.

[[mask]]
region = "ram"
start = 0xFFFDF3
end = 0xFFFDF4
reason = """the low byte of the PC stacked by the vertical interrupt, frame at SP $FFFDEE \
(at SP $FFFDF2 this is the stacked SR's low byte). Every stop interrupts the idle loop at \
$0029AC (12 cycles, latching at 8) or $0029B0 (10 cycles, latching at its start), so this \
byte is $AC or $B0: the loop's phase when the interrupt comes, which needs each frame's work \
to be cycle exact. With the M1.3 interrupt response (latch points, E-clock acknowledge) 211 \
of 294 stops match (150 before); the rest await per-frame exactness (Z80 bus use in Phase 3, VDP access \
slot positions)"""

[[mask]]
region = "ram"
start = 0xFFFDF7
end = 0xFFFDF8
reason = """the same stacked PC low byte for the frame at SP $FFFDF2"""

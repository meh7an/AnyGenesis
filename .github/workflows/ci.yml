name: CI

# Manual only: the private repo has no Actions minutes, so push-triggered runs would only fail.
# Restore `push: branches: [main]` and `pull_request:` once runs are paid for.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDL3 is built from source by the frontend's sdl3-src. Its CMake fails without the X11
      # extensions (XTest included); audio headers are left out until the audio milestones.
      # The Windows runner already has CMake.
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev

      # Installs the version pinned in rust-toolchain.toml, with its components.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Legal guard
        run: cargo xtask legal

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
